# ─────────────────────────────
# Workspace Auto-Assign Rules
# ─────────────────────────────

# AI Workspace
windowrulev2 = workspace:3, class:^(chrome-chatgpt\.com__-Default)$
windowrulev2 = workspace:3, class:^(chrome-claude\.ai__.*-Default)$

# Chat Workspace
windowrulev2 = workspace:5, class:^(chrome-web\.telegram\.org__k_-Default)$
windowrulev2 = workspace:5, class:^(org\.telegram\.desktop)$
windowrulev2 = workspace:5, class:^(chrome-web\.whatsapp\.com__-Default)$
windowrulev2 = workspace:5, class:^(chrome-discord\.com__app-Default)$
windowrulev2 = workspace:5, class:^(chrome-discord\.com__channels_@me-Default)$
windowrulev2 = workspace:5, class:^(chrome-teams\.microsoft\.com__v2_-Default)$
windowrulev2 = workspace:5, class:^(com\.github\.IsmaelMartinez\.teams_for_linux)$

# Floating helper windows
windowrulev2 = float, class:^(float-window)$
windowrulev2 = center, class:^(float-window)$
windowrulev2 = size 800 600, class:^(float-window)$

# Snipaste – Snipper window stays focused and pinned
windowrulev2 = stayfocused, class:^(Snipaste)$, title:^(Snipper - Snipaste)$
windowrulev2 = pin,         class:^(Snipaste)$, title:^(Snipper - Snipaste)$

# Unnamed Snipaste window
windowrulev2 = stayfocused, class:^(Snipaste)$, title:^(Snipaste)$
windowrulev2 = pin,         class:^(Snipaste)$, title:^(Snipaste)$

# Explicitly allow Paster to behave normally
windowrulev2 = unset, class:^(Snipaste)$, title:^(Paster - Snipaste)$
