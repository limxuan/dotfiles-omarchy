# Application bindings
$terminal = uwsm app -- $TERMINAL
$browser = omarchy-launch-browser

bind = SUPER, h, exec, bash -c "hyprctl clients > /tmp/debug.txt"

bindd = SUPER, return, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER SHIFT, B, Password Manager, exec, bitwarden-desktop
bindd = SUPER, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER, N, Editor, exec, omarchy-launch-editor
bindd = SUPER, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER, O, Obsidian, exec, omarchy-launch-or-focus obsidian "uwsm app -- obsidian -disable-gpu --enable-wayland-ime"

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT, A, Claude, exec, omarchy-launch-webapp "https://claude.ai"
bindd = SUPER, Y, YouTube, exec, omarchy-launch-or-focus-webapp YouTube "https://youtube.com/"
bindd = SUPER, G, Power Mode, exec, omarchy-menu power
unbind = ALT, TAB
bindd = ALT, TAB, Find windows, exec, ~/.config/scripts/find-open-window.sh

bindd = SUPER, C, Launch all chats, exec, ~/.config/scripts/launch_chats.sh
bindd = SUPER SHIFT, C, Launch calendar, exec, omarchy-launch-or-focus-webapp "Google Calendar" "https://calendar.google.com/calendar/"
bindd = SUPER, L, TickTick, exec, omarchy-launch-or-focus-webapp TickTick "https://ticktick.com/"
# bindd = SUPER ALT, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
# bindd = SUPER, X, X, exec, omarchy-launch-webapp "https://x.com/"
# bindd = SUPER SHIFT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
unbind = SUPER, mouse_down
unbind = SUPER, mouse_up
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Override default Windows + numbers
bind = CTRL|ALT|SHIFT, 1, workspace, 1
bind = CTRL|ALT|SHIFT, 2, workspace, 2
bind = CTRL|ALT|SHIFT, 3, workspace, 3
bind = CTRL|ALT|SHIFT, 4, workspace, 4
bind = CTRL|ALT|SHIFT, 5, workspace, 5
bind = CTRL|ALT|SHIFT, 6, workspace, 6
bind = CTRL|ALT|SHIFT, 7, workspace, 7
bind = CTRL|ALT|SHIFT, 8, workspace, 8
bind = CTRL|ALT|SHIFT, 9, workspace, 9
bindd = CTRL|ALT|SHIFT, w, Close active window, killactive

# Screenshot utilities
unbind =, PRINT
bind = CTRL ALT SHIFT, s, exec, omarchy-cmd-screenshot smart clipboard
bind = CTRL ALT SHIFT, x, exec, Snipaste snip
bindd = CTRL ALT SHIFT,g,Grab text from region,exec, grim -g "$(slurp)" - | tesseract stdin stdout | wl-copy
bindd = , PRINT, Screenshot, exec, ~/.config/scripts/edit-clipboard-with-satty.sh
# bind = CTRL SHIFT ALT SUPER, s, exec, env QT_SCALE_FACTOR=0.65 flameshot gui

bind = CTRL ALT SHIFT, d, exec, ~/.config/scripts/paste-clipboard.fish
bind = CTRL ALT SHIFT, f, exec, hyprctl dispatch fullscreen 1
bind = CTRL ALT SHIFT, space, exec, omarchy-launch-walker -m clipboard
bind = CTRL ALT SHIFT SUPER, space, exec, omarchy-restart-walker
bindd = CTRL ALT SHIFT, t, Toggle floating, togglefloating,
bindd = CTRL ALT SHIFT, b, Toggle Trackpad, exec, ~/.config/scripts/toggle-trackpad.sh
bindd = ALT, SPACE, Launch apps, exec, walker -p "Start…"

# Move with right alt and rshift
bindd = ALT SHIFT, code:10, Move window to workspace 1, movetoworkspace, 1
bindd = ALT SHIFT, code:11, Move window to workspace 2, movetoworkspace, 2
bindd = ALT SHIFT, code:12, Move window to workspace 3, movetoworkspace, 3
bindd = ALT SHIFT, code:13, Move window to workspace 4, movetoworkspace, 4
bindd = ALT SHIFT, code:14, Move window to workspace 5, movetoworkspace, 5
bindd = ALT SHIFT, code:15, Move window to workspace 6, movetoworkspace, 6
bindd = ALT SHIFT, code:16, Move window to workspace 7, movetoworkspace, 7
bindd = ALT SHIFT, code:17, Move window to workspace 8, movetoworkspace, 8
bindd = ALT SHIFT, code:18, Move window to workspace 9, movetoworkspace, 9
bindd = ALT SHIFT, code:19, Move window to workspace 10, movetoworkspace, 10
bindd = ALT SHIFT, code:20, Move window to workspace 10, movetoworkspace, 10
bindd = ALT SHIFT, X, Move to workspace 7 and back,exec, ~/.config/scripts/move-all-windows-to-primary-monitor.sh

# Copy / Paste
bind = CTRL ALT SHIFT, C, sendshortcut, CTRL, Insert,
bind = CTRL ALT SHIFT, V, sendshortcut, SHIFT, Insert,
bind = CTRL ALT SHIFT, X, sendshortcut, CTRL, X,
bind = CTRL ALT SHIFT, A, sendshortcut, CTRL, A,


# ─────────────────────────────
#  Screen Control Shortcuts
# ─────────────────────────────
# Unbind any existing Omarchy actions for arrow keys
bind = ALTGR, RIGHT, exec, ~/.config/scripts/rotate-monitors.sh right
bind = ALTGR, LEFT, exec, ~/.config/scripts/rotate-monitors.sh left
bindm = SUPER, mouse:273, resizewindow
